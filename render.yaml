# Render Blueprint for the Express API (free web service).
# In Render: New > Blueprint > pick this repo. Then fill in the secret env vars in the dashboard.
services:
  - type: web
    name: interview-prep-kit-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ORIGIN
        sync: false # your Vercel URL, e.g. https://interview-prep-kit.vercel.app
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDERS
        value: gemini,groq
